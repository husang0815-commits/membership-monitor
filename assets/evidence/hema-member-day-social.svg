<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">盒马会员日社媒信号证据图</title>
  <desc id="desc">截图式视觉资产，展示盒马会员日社媒热度。</desc>
  <rect width="960" height="540" fill="#f0fdfa"/>
  <rect x="64" y="42" width="832" height="456" rx="26" fill="#ffffff"/>
  <rect x="94" y="78" width="360" height="384" rx="22" fill="#ccfbf1"/>
  <text x="124" y="134" font-family="Microsoft YaHei, Arial" font-size="30" font-weight="700" fill="#115e59">盒马会员日</text>
  <text x="124" y="182" font-family="Microsoft YaHei, Arial" font-size="20" fill="#0f766e">到店活动讨论升温</text>
  <rect x="124" y="236" width="270" height="36" rx="18" fill="#ffffff"/>
  <rect x="124" y="294" width="220" height="36" rx="18" fill="#ffffff"/>
  <rect x="124" y="352" width="300" height="36" rx="18" fill="#ffffff"/>
  <text x="506" y="132" font-family="Microsoft YaHei, Arial" font-size="26" font-weight="700" fill="#0f172a">社媒热度信号</text>
  <text x="506" y="182" font-family="Microsoft YaHei, Arial" font-size="18" fill="#475569">公众号、小红书等公开讨论提示活动传播。</text>
  <rect x="506" y="230" width="290" height="72" rx="16" fill="#f8fafc"/>
  <rect x="506" y="322" width="290" height="72" rx="16" fill="#f8fafc"/>
  <text x="532" y="274" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="700" fill="#0f766e">状态：待核验</text>
  <text x="532" y="366" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="700" fill="#334155">线下到店复购</text>
  <text x="506" y="438" font-family="Microsoft YaHei, Arial" font-size="17" fill="#64748b">示意截图：正式结论需补门店/官网证据。</text>
</svg>
