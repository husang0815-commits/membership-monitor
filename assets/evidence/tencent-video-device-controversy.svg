<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">腾讯视频会员争议信号证据图</title>
  <desc id="desc">截图式视觉资产，展示设备权益争议信号。</desc>
  <rect width="960" height="540" fill="#fef2f2"/>
  <rect x="58" y="48" width="844" height="444" rx="24" fill="#ffffff"/>
  <rect x="58" y="48" width="844" height="96" rx="24" fill="#fecaca"/>
  <text x="92" y="109" font-family="Microsoft YaHei, Arial" font-size="34" font-weight="700" fill="#7f1d1d">腾讯视频 VIP</text>
  <text x="92" y="190" font-family="Microsoft YaHei, Arial" font-size="25" font-weight="700" fill="#111827">设备权益争议与分层付费</text>
  <rect x="92" y="242" width="350" height="156" rx="18" fill="#fee2e2"/>
  <rect x="492" y="242" width="330" height="156" rx="18" fill="#f8fafc"/>
  <text x="124" y="306" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="700" fill="#b91c1c">负反馈样本</text>
  <text x="124" y="350" font-family="Microsoft YaHei, Arial" font-size="18" fill="#475569">设备限制、升级引导、权益解释</text>
  <text x="524" y="306" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="700" fill="#334155">需持续观察</text>
  <text x="524" y="350" font-family="Microsoft YaHei, Arial" font-size="18" fill="#475569">会员分层规则是否透明</text>
  <text x="92" y="454" font-family="Microsoft YaHei, Arial" font-size="17" fill="#64748b">示意截图：不把社媒争议直接当作正式结论。</text>
</svg>
