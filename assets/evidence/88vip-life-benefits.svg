<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">88VIP 生活权益证据图</title>
  <desc id="desc">截图式视觉资产，展示 88VIP 生活权益包。</desc>
  <rect width="960" height="540" fill="#fff7ed"/>
  <rect x="56" y="46" width="848" height="448" rx="24" fill="#ffffff"/>
  <rect x="56" y="46" width="848" height="104" rx="24" fill="#fde68a"/>
  <text x="92" y="112" font-family="Microsoft YaHei, Arial" font-size="36" font-weight="700" fill="#78350f">88VIP 权益中心</text>
  <text x="92" y="196" font-family="Microsoft YaHei, Arial" font-size="25" font-weight="700" fill="#111827">购物会员转向生活方式会员</text>
  <text x="92" y="236" font-family="Microsoft YaHei, Arial" font-size="18" fill="#475569">盒马、饿了么/闪购、飞猪、高德、观影等权益被纳入统一权益包。</text>
  <rect x="92" y="286" width="150" height="110" rx="18" fill="#fef3c7"/>
  <rect x="264" y="286" width="150" height="110" rx="18" fill="#ffedd5"/>
  <rect x="436" y="286" width="150" height="110" rx="18" fill="#e0f2fe"/>
  <rect x="608" y="286" width="150" height="110" rx="18" fill="#dcfce7"/>
  <text x="137" y="350" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#92400e">盒马</text>
  <text x="301" y="350" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#c2410c">闪购</text>
  <text x="481" y="350" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#0369a1">飞猪</text>
  <text x="653" y="350" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="700" fill="#15803d">高德</text>
  <text x="92" y="455" font-family="Microsoft YaHei, Arial" font-size="17" fill="#64748b">示意截图：突出跨场景权益聚合</text>
</svg>
