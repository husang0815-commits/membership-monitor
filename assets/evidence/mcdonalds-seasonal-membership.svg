<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">麦当劳会员节气活动证据图</title>
  <desc id="desc">截图式视觉资产，展示麦当劳会员活动节奏。</desc>
  <rect width="960" height="540" fill="#fefce8"/>
  <rect x="56" y="48" width="848" height="444" rx="24" fill="#ffffff"/>
  <rect x="56" y="48" width="848" height="96" rx="24" fill="#fef08a"/>
  <text x="92" y="109" font-family="Microsoft YaHei, Arial" font-size="34" font-weight="700" fill="#854d0e">麦麦会员</text>
  <text x="92" y="190" font-family="Microsoft YaHei, Arial" font-size="25" font-weight="700" fill="#111827">全年活动节奏强化高频复购</text>
  <rect x="92" y="246" width="720" height="14" rx="7" fill="#fde68a"/>
  <circle cx="150" cy="253" r="32" fill="#facc15"/>
  <circle cx="328" cy="253" r="32" fill="#f97316"/>
  <circle cx="506" cy="253" r="32" fill="#22c55e"/>
  <circle cx="684" cy="253" r="32" fill="#3b82f6"/>
  <text x="118" y="336" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="700" fill="#854d0e">节气</text>
  <text x="294" y="336" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="700" fill="#854d0e">任务</text>
  <text x="472" y="336" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="700" fill="#854d0e">优惠</text>
  <text x="650" y="336" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="700" fill="#854d0e">复购</text>
  <text x="92" y="430" font-family="Microsoft YaHei, Arial" font-size="18" fill="#475569">示意截图：固定节奏让会员产生周期性回访。</text>
</svg>
