<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Costco 黑钻会籍证据图</title>
  <desc id="desc">截图式视觉资产，展示黑钻会籍返利权益。</desc>
  <rect width="960" height="540" fill="#f5f3ff"/>
  <rect x="56" y="48" width="848" height="444" rx="24" fill="#ffffff"/>
  <rect x="96" y="92" width="330" height="212" rx="24" fill="#312e81"/>
  <text x="126" y="154" font-family="Microsoft YaHei, Arial" font-size="30" font-weight="700" fill="#ffffff">BLACK DIAMOND</text>
  <text x="126" y="214" font-family="Microsoft YaHei, Arial" font-size="24" fill="#ddd6fe">Costco 中国</text>
  <text x="126" y="260" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="700" fill="#fef3c7">3% 消费返利</text>
  <text x="494" y="134" font-family="Microsoft YaHei, Arial" font-size="28" font-weight="700" fill="#4c1d95">高价值会员分层</text>
  <text x="494" y="190" font-family="Microsoft YaHei, Arial" font-size="19" fill="#475569">年费 688 元，年度返利上限最高 7200 元。</text>
  <rect x="494" y="238" width="292" height="28" rx="14" fill="#ddd6fe"/>
  <rect x="494" y="238" width="218" height="28" rx="14" fill="#7c3aed"/>
  <text x="494" y="326" font-family="Microsoft YaHei, Arial" font-size="18" fill="#475569">示意截图：返利机制让高价会员价值更可计算。</text>
  <rect x="96" y="374" width="708" height="56" rx="16" fill="#f8fafc"/>
  <text x="126" y="410" font-family="Microsoft YaHei, Arial" font-size="18" fill="#64748b">适合高频、高客单家庭消费用户</text>
</svg>
